<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>《悔》Regret — HTML 可游玩机制 Demo</title>
<style>
  :root{
    --ink:#0a0a0b; --paper:#e9e4d8; --red:#9b181c; --gold:#b59552;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050506;color:#eee;font-family:"Noto Serif SC","Songti SC","STSong","Microsoft YaHei",serif}
  #wrap{position:fixed;inset:0;display:grid;place-items:center;background:#050506}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;image-rendering:auto}
  #overlay{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,rgba(70,15,15,.18),rgba(0,0,0,.92) 58%,#000);
    z-index:20;padding:24px;text-align:center;
  }
  .panel{
    width:min(780px,94vw);padding:32px 28px 26px;border:1px solid rgba(180,46,46,.45);
    background:linear-gradient(180deg,rgba(14,12,12,.95),rgba(6,6,7,.97));
    box-shadow:0 20px 80px rgba(0,0,0,.75), inset 0 0 50px rgba(120,0,0,.07);
  }
  .seal{font-size:14px;letter-spacing:.45em;color:#b44;text-transform:uppercase;margin-bottom:8px}
  h1{margin:0;color:#b92528;font-size:clamp(48px,8vw,86px);font-weight:700;letter-spacing:.18em;text-indent:.18em}
  .subtitle{color:#b9aa8d;font-size:16px;letter-spacing:.16em;margin:6px 0 22px}
  .desc{max-width:650px;margin:0 auto 20px;line-height:1.85;color:#c9c4bb;font-size:15px}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0;text-align:left}
  .keys div{border-top:1px solid rgba(255,255,255,.09);padding:8px 6px;color:#999;font-size:13px}
  .keys b{color:#ddd;font-weight:600}
  button.start{
    appearance:none;border:1px solid #8e2022;background:#6f1114;color:#f1e7d1;
    padding:12px 28px;font:600 16px inherit;letter-spacing:.15em;cursor:pointer;
    box-shadow:inset 0 0 22px rgba(255,60,60,.08);
  }
  button.start:hover{background:#8e171a}
  .note{font-size:12px;color:#666;margin-top:13px}
  #touch{position:fixed;inset:0;z-index:8;pointer-events:none;display:none}
  .touchGroup{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}
  #moveTouch{left:max(18px,env(safe-area-inset-left))}
  #actTouch{right:max(18px,env(safe-area-inset-right));align-items:flex-end}
  .tb{
    width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.23);
    background:rgba(0,0,0,.36);backdrop-filter:blur(4px);color:#eee;
    display:grid;place-items:center;font:600 18px system-ui;user-select:none;-webkit-user-select:none;
    box-shadow:0 2px 20px rgba(0,0,0,.28)
  }
  .tb.small{width:54px;height:54px;font-size:12px}
  .tb:active,.tb.on{background:rgba(125,18,20,.58);transform:scale(.96)}
  #rotateHint{display:none;position:fixed;inset:0;z-index:40;background:#050506;color:#ddd;align-items:center;justify-content:center;text-align:center;padding:28px;line-height:1.8}
  @media (pointer:coarse){#touch{display:block}.keys{grid-template-columns:1fr 1fr}}
  @media (orientation:portrait) and (pointer:coarse){#rotateHint{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<div id="overlay">
  <div class="panel">
    <div class="seal">PLAYABLE MECHANIC PROTOTYPE</div>
    <h1>悔</h1>
    <div class="subtitle">REGRET · 序章「无明古刹」机制切片</div>
    <p class="desc">
      你的生命值也是“清醒值”。<b>高于 50%</b> 时，你困在宏伟却虚假的表世界；
      <b>降至 50% 或以下</b>，幻境剥落，真实战场与隐藏道路显现。
      你必须主动伤害自己进入里世界，再靠近战处决夺回精气，逃回幻境。
    </p>
    <div class="keys">
      <div><b>A / D</b>　移动</div><div><b>Space / W</b>　跳跃</div><div><b>J</b>　斩击</div>
      <div><b>H</b>　自毁 −20</div><div><b>E</b>　处决 / 吸取精气</div><div><b>R</b>　重开</div>
    </div>
    <button class="start" id="startBtn">踏入幻境</button>
    <div class="note">单文件 HTML · 无外部素材依赖 · 支持键盘与触屏</div>
  </div>
</div>

<div id="touch">
  <div class="touchGroup" id="moveTouch">
    <div class="tb" data-key="left">◀</div>
    <div class="tb" data-key="right">▶</div>
  </div>
  <div class="touchGroup" id="actTouch">
    <div class="tb small" data-key="harm">自毁</div>
    <div class="tb small" data-key="execute">处决</div>
    <div class="tb" data-key="attack">斩</div>
    <div class="tb" data-key="jump">跃</div>
  </div>
</div>

<div id="rotateHint">建议横屏游玩《悔》Demo<br>旋转设备后即可继续</div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

const VIEW_W = 1280, VIEW_H = 720, WORLD_W = 4700;
let scale=1, offX=0, offY=0, dpr=1;
let started=false, last=0, time=0, shake=0, flash=0, transition=0, transitionDir=1;
let cameraX=0, message='', messageT=0, objectiveT=0, worldPulse=0;
let win=false, dead=false, bossIntro=false, bossKilled=false;
let audioCtx=null;

function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(innerWidth*dpr); canvas.height=Math.round(innerHeight*dpr);
  canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
  scale=Math.min(innerWidth/VIEW_W,innerHeight/VIEW_H);
  offX=(innerWidth-VIEW_W*scale)/2; offY=(innerHeight-VIEW_H*scale)/2;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
}
addEventListener('resize',resize); resize();

const keys={left:false,right:false,jump:false,attack:false,harm:false,execute:false};
const pressed={jump:false,attack:false,harm:false,execute:false};

function mapKey(e,down){
  const k=e.code;
  let name=null;
  if(k==='KeyA'||k==='ArrowLeft') name='left';
  if(k==='KeyD'||k==='ArrowRight') name='right';
  if(k==='Space'||k==='KeyW'||k==='ArrowUp') name='jump';
  if(k==='KeyJ'||k==='KeyK') name='attack';
  if(k==='KeyH') name='harm';
  if(k==='KeyE') name='execute';
  if(k==='KeyR' && down){ reset(); return; }
  if(name){
    e.preventDefault();
    if(down && !keys[name] && pressed.hasOwnProperty(name)) pressed[name]=true;
    keys[name]=down;
  }
}
addEventListener('keydown',e=>mapKey(e,true),{passive:false});
addEventListener('keyup',e=>mapKey(e,false),{passive:false});

document.querySelectorAll('.tb').forEach(b=>{
  const k=b.dataset.key;
  const down=e=>{e.preventDefault();b.classList.add('on');if(!keys[k]&&pressed.hasOwnProperty(k))pressed[k]=true;keys[k]=true;};
  const up=e=>{e.preventDefault();b.classList.remove('on');keys[k]=false;};
  b.addEventListener('pointerdown',down); b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up); b.addEventListener('pointerleave',up);
});

function beep(freq=100,dur=.05,type='sine',vol=.025){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=vol;
    o.connect(g);g.connect(audioCtx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

const player={
  x:120,y:530,w:34,h:62,vx:0,vy:0,onGround:false,dir:1,
  hp:100,maxHp:100,inner:false,atk:0,inv:0,hurt:0,trail:[],lastSafeX:120,
  harmCd:0, executeCd:0
};
const enemy={
  x:2570,y:548,w:42,h:44,hp:3,alive:true,stunned:false,dir:-1,hitCd:0,patrolA:2460,patrolB:2830
};
const boss={
  x:3890,y:455,w:92,h:138,hp:12,maxHp:12,alive:true,stunned:false,dir:-1,hitCd:0,attackCd:1.2,phase:0
};

const particles=[];
function particle(x,y,n,kind='ash'){
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:(Math.random()-.5)*(kind==='blood'?220:80),vy:(Math.random()-.7)*(kind==='blood'?170:90),
      life:.4+Math.random()*.8,max:1,size:1+Math.random()*(kind==='blood'?4:2),kind});
  }
}

const commonPlatforms=[
  {x:0,y:610,w:1050,h:110},{x:2180,y:610,w:1260,h:110},{x:3370,y:610,w:1330,h:110},
  {x:430,y:510,w:190,h:22},{x:700,y:445,w:190,h:20},{x:2360,y:505,w:180,h:18},
  {x:2820,y:455,w:190,h:18},{x:3450,y:510,w:210,h:20}
];
const innerPlatforms=[
  {x:1010,y:582,w:150,h:30},{x:1140,y:560,w:160,h:42},{x:1280,y:590,w:170,h:22},
  {x:1430,y:548,w:180,h:64},{x:1600,y:575,w:200,h:38},{x:1780,y:540,w:180,h:72},
  {x:1940,y:570,w:250,h:42}
];
const surfaceSolids=[
  {x:965,y:330,w:55,h:280,kind:'falseWall'},
  {x:3170,y:420,w:70,h:190,kind:'falseGate'}
];
const innerSolids=[
  {x:3030,y:520,w:95,h:90,kind:'wreck'}
];

function reset(){
  Object.assign(player,{x:120,y:530,vx:0,vy:0,hp:100,inner:false,atk:0,inv:0,hurt:0,lastSafeX:120,harmCd:0,executeCd:0});
  Object.assign(enemy,{x:2570,y:548,hp:3,alive:true,stunned:false,dir:-1,hitCd:0});
  Object.assign(boss,{x:3890,y:455,hp:12,alive:true,stunned:false,dir:-1,hitCd:0,attackCd:1.2,phase:0});
  cameraX=0;message='沿古刹前行。虚妄会阻挡你的路。';messageT=4;objectiveT=7;
  transition=0;flash=0;shake=0;win=false;dead=false;bossIntro=false;bossKilled=false;particles.length=0;
}

function worldSwitch(){
  const should=player.hp<=50;
  if(should!==player.inner){
    player.inner=should; transition=1; transitionDir=should?1:-1; worldPulse=1;
    shake=Math.max(shake,9); beep(should?58:145,.28,'sawtooth',.035);
    particle(player.x+player.w/2,player.y+player.h/2,35,should?'blood':'ash');
    message=should?'【里世界】真实道路显现。清醒正在流失。':'【表世界】幻境重新覆盖现实。';
    messageT=2.6;
  }
}

function damage(amount,source='enemy'){
  if(player.inv>0||dead||win)return;
  player.hp=Math.max(0,player.hp-amount);
  player.inv=.65;player.hurt=.25;shake=Math.max(shake,7);flash=.12;
  particle(player.x+player.w/2,player.y+30,source==='harm'?12:9,'blood');
  beep(70,.07,'square',.03); worldSwitch();
  if(player.hp<=0){ dead=true; message='意识沉入血海……按 R 重塑。'; messageT=999; }
}

function heal(amount){
  if(dead||win)return;
  player.hp=Math.min(player.maxHp,player.hp+amount);
  particle(player.x+player.w/2,player.y+28,22,'ash');beep(210,.14,'triangle',.03);worldSwitch();
}

function rectOverlap(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}

function getSolids(){
  return commonPlatforms.concat(player.inner?innerPlatforms:surfaceSolids);
}

function moveAndCollide(o,dt){
  o.x+=o.vx*dt;
  let box={x:o.x,y:o.y,w:o.w,h:o.h};
  for(const p of getSolids()){
    if(rectOverlap(box,p)){
      if(o.vx>0)o.x=p.x-o.w; else if(o.vx<0)o.x=p.x+p.w;
      o.vx=0;box.x=o.x;
    }
  }
  o.y+=o.vy*dt;o.onGround=false;
  box={x:o.x,y:o.y,w:o.w,h:o.h};
  for(const p of getSolids()){
    if(rectOverlap(box,p)){
      if(o.vy>0){o.y=p.y-o.h;o.vy=0;o.onGround=true;}
      else if(o.vy<0){o.y=p.y+p.h;o.vy=0;}
      box.y=o.y;
    }
  }
}

function attackBox(){
  return {x:player.dir>0?player.x+player.w-4:player.x-60,y:player.y+8,w:64,h:48};
}

function update(dt){
  if(!started)return;
  time+=dt;
  if(messageT>0)messageT-=dt;if(objectiveT>0)objectiveT-=dt;
  if(player.inv>0)player.inv-=dt;if(player.hurt>0)player.hurt-=dt;
  if(player.harmCd>0)player.harmCd-=dt;if(player.executeCd>0)player.executeCd-=dt;
  if(enemy.hitCd>0)enemy.hitCd-=dt;if(boss.hitCd>0)boss.hitCd-=dt;
  transition=Math.max(0,transition-dt*1.35);flash=Math.max(0,flash-dt);
  shake=Math.max(0,shake-dt*20);worldPulse=Math.max(0,worldPulse-dt*1.4);

  if(dead||win){
    for(const k in pressed)pressed[k]=false;
    updateParticles(dt); return;
  }

  // 核心资源循环：里世界持续掉血
  if(player.inner){
    player.hp=Math.max(0,player.hp-dt*1.35);
    if(player.hp<=0){dead=true;message='清醒归零。你没能从真实中回来……按 R 重塑。';messageT=999;}
  }

  // 移动
  const move=(keys.left?-1:0)+(keys.right?1:0);
  const target=move*250;
  player.vx += (target-player.vx)*Math.min(1,dt*(player.onGround?13:6));
  if(move)player.dir=Math.sign(move);
  if(pressed.jump && player.onGround){player.vy=-520;beep(120,.04,'triangle',.014);}
  player.vy+=1250*dt; if(player.vy>820)player.vy=820;

  // 自毁
  if(pressed.harm && player.harmCd<=0){
    player.harmCd=.55; damage(20,'harm');
    message='割肉自毁：清醒值 −20';messageT=1.1;
  }

  // 攻击
  if(pressed.attack && player.atk<=0){
    player.atk=.24;beep(170,.04,'sawtooth',.018);
  }
  if(player.atk>0){
    const was=player.atk;player.atk-=dt;
    if(was>.16 && player.atk<=.16){
      const ab=attackBox();
      if(enemy.alive && enemy.hitCd<=0 && rectOverlap(ab,enemy)){
        enemy.hp--;enemy.hitCd=.35;shake=5;particle(enemy.x+20,enemy.y+20,10,'blood');
        if(enemy.hp<=0){enemy.stunned=true;message='敌人跪倒。靠近并按 E 处决，夺回精气。';messageT=3.5;}
      }
      if(boss.alive && boss.hitCd<=0 && rectOverlap(ab,boss)){
        const dmg=player.inner?2:1;
        boss.hp-=dmg;boss.hitCd=.28;shake=8;particle(boss.x+45,boss.y+55,16,'blood');
        if(!player.inner){message='表世界的刀锋像砍在幻象上……里世界能看见它的真实伤口。';messageT=2.3;}
        if(boss.hp<=0){boss.hp=0;boss.stunned=true;message='判官残躯倒下。按 E 斩断幻觉。';messageT=4;}
      }
    }
  }

  // 处决
  if(pressed.execute && player.executeCd<=0){
    player.executeCd=.5;
    const pr={x:player.x-70,y:player.y-25,w:player.w+140,h:player.h+50};
    if(enemy.alive && enemy.stunned && rectOverlap(pr,enemy)){
      enemy.alive=false;enemy.stunned=false;heal(30);shake=13;
      message='处决：吸取精气 +30。你被强行拉回表世界。';messageT=3.2;particle(enemy.x+20,enemy.y+20,30,'blood');
    }else if(boss.alive && boss.stunned && rectOverlap(pr,boss)){
      boss.alive=false;boss.stunned=false;bossKilled=true;heal(25);shake=18;transition=1;
      message='【墨影化形】获得。古刹尽头的幻门已经开启。';messageT=5;particle(boss.x+45,boss.y+60,55,'blood');
    }else{
      message='附近没有可处决的目标。';messageT=.9;
    }
  }

  moveAndCollide(player,dt);
  player.x=Math.max(0,Math.min(WORLD_W-player.w,player.x));

  // 掉入深渊
  if(player.y>780){
    damage(15,'fall'); player.x=player.lastSafeX;player.y=500;player.vx=0;player.vy=0;
    message='你从断桥坠落。';messageT=1.1;
  }
  if(player.onGround && (player.x<960 || (player.x>2200&&player.x<3350) || player.x>3380))player.lastSafeX=player.x;

  // 引导提示
  if(player.x>760 && player.x<1030 && !player.inner && objectiveT<=0){
    message='前方石门是虚妄。按 H 主动削减清醒值，跌入里世界。';messageT=.25;
  }
  if(player.x>1050&&player.x<1500&&player.inner){
    message='战马骸骨在现实中成为桥梁。不要停留：里世界会持续掉血。';messageT=.25;
  }
  if(player.x>3000&&player.x<3220&&!player.inner){
    message='第二道幻门仍在阻挡你。你已经知道代价。';messageT=.25;
  }

  updateEnemy(dt);
  updateBoss(dt);

  if(bossKilled && player.x>4510){
    win=true;message='Demo 完成：你穿过“无明古刹”，带着新神通继续走向妄念竹林。';messageT=999;
    beep(240,.4,'triangle',.035);
  }

  cameraX += ((Math.max(0,Math.min(WORLD_W-VIEW_W,player.x-VIEW_W*.36)))-cameraX)*Math.min(1,dt*5.5);
  updateParticles(dt);
  for(const k in pressed)pressed[k]=false;
}

function updateEnemy(dt){
  if(!enemy.alive)return;
  if(enemy.stunned){enemy.vx=0;return;}
  const dist=player.x-enemy.x;
  if(Math.abs(dist)<250){
    enemy.dir=Math.sign(dist)||enemy.dir;
    enemy.x+=enemy.dir*62*dt;
    if(Math.abs(dist)<48 && Math.abs((player.y+30)-(enemy.y+20))<55 && enemy.hitCd<=0){
      enemy.hitCd=1.0; damage(player.inner?11:7,'enemy');
      player.vx=-enemy.dir*210;player.vy=-180;
    }
  }else{
    enemy.x+=enemy.dir*34*dt;
    if(enemy.x<enemy.patrolA){enemy.x=enemy.patrolA;enemy.dir=1}
    if(enemy.x>enemy.patrolB){enemy.x=enemy.patrolB;enemy.dir=-1}
  }
}

function updateBoss(dt){
  if(!boss.alive)return;
  if(boss.stunned){boss.attackCd=999;return;}
  if(player.x>3500&&!bossIntro){
    bossIntro=true;message='判官残躯： “你为何还不肯醒？”';messageT=3.2;shake=10;beep(48,.35,'sawtooth',.028);
  }
  if(!bossIntro)return;
  const dist=player.x-boss.x;boss.dir=Math.sign(dist)||boss.dir;
  boss.attackCd-=dt;
  if(Math.abs(dist)>110)boss.x+=boss.dir*(player.inner?48:38)*dt;
  if(boss.attackCd<=0 && Math.abs(dist)<190){
    boss.attackCd=player.inner?.95:1.25;
    // 扇形近战简化成范围判定
    if(Math.abs(dist)<155 && Math.abs((player.y+30)-(boss.y+70))<100){
      damage(player.inner?16:11,'boss');
      player.vx=-boss.dir*300;player.vy=-240;
    }
    shake=Math.max(shake,5);particle(boss.x+45,boss.y+95,7,'ash');
  }
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}
    p.vy+=180*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
}

function draw(){
  ctx.save();
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
  ctx.clearRect(0,0,VIEW_W,VIEW_H);
  const sx=(Math.random()-.5)*shake, sy=(Math.random()-.5)*shake*.55;
  ctx.translate(sx,sy);

  drawBackground();
  ctx.save();ctx.translate(-cameraX,0);
  drawWorld();
  drawActors();
  drawParticles();
  ctx.restore();
  drawUI();
  drawTransition();
  ctx.restore();
}

function drawBackground(){
  const inner=player.inner;
  const g=ctx.createLinearGradient(0,0,0,VIEW_H);
  if(inner){g.addColorStop(0,'#1a0708');g.addColorStop(.52,'#3a1011');g.addColorStop(1,'#090405');}
  else{g.addColorStop(0,'#091114');g.addColorStop(.52,'#172126');g.addColorStop(1,'#08090a');}
  ctx.fillStyle=g;ctx.fillRect(0,0,VIEW_W,VIEW_H);

  // 月 / 血日
  ctx.globalAlpha=.8;
  ctx.fillStyle=inner?'#9e2927':'#d0c7a7';
  ctx.beginPath();ctx.arc(1035-cameraX*.05,105,inner?54:43,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;

  // 远景山 / 烟
  for(let i=0;i<7;i++){
    const x=(i*310-(cameraX*.12)%310)-80;
    ctx.fillStyle=inner?`rgba(35,10,10,${.30+i*.02})`:`rgba(7,14,16,${.45+i*.02})`;
    ctx.beginPath();ctx.moveTo(x,470);ctx.lineTo(x+160,240+(i%3)*40);ctx.lineTo(x+350,470);ctx.closePath();ctx.fill();
  }
  // 双重曝光幽影
  if(inner){
    ctx.globalAlpha=.15;
    for(let i=0;i<13;i++){
      const x=((i*137-cameraX*.23)%1500)-100;
      ctx.fillStyle='#d7b3a2';ctx.fillRect(x,390+(i%3)*20,5,105);
      ctx.beginPath();ctx.arc(x+2.5,380+(i%3)*20,8,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }else{
    // 古刹屋檐剪影
    ctx.fillStyle='rgba(2,4,5,.58)';
    for(let i=0;i<4;i++){
      const x=i*430-(cameraX*.18)%430;
      ctx.fillRect(x,300,260,130);
      ctx.beginPath();ctx.moveTo(x-45,310);ctx.lineTo(x+130,230);ctx.lineTo(x+305,310);ctx.closePath();ctx.fill();
    }
  }
  // 雾 / 烟
  for(let i=0;i<5;i++){
    ctx.fillStyle=inner?'rgba(110,25,22,.04)':'rgba(180,200,190,.035)';
    ctx.beginPath();ctx.ellipse(180+i*260-(cameraX*.08)%220,500-(i%2)*50,240,55,0,0,Math.PI*2);ctx.fill();
  }
}

function drawWorld(){
  // 地面
  for(const p of commonPlatforms) drawPlatform(p,false);
  if(player.inner){
    for(const p of innerPlatforms) drawBoneBridge(p);
    for(const p of innerSolids) drawPlatform(p,true);
  }else{
    for(const p of surfaceSolids) drawFalseWall(p);
  }

  // 场景地标
  drawLantern(320,510);
  drawLantern(2870,455);
  drawShrine(820,610);
  drawBossGate(4390,610);

  // 坑底
  ctx.fillStyle=player.inner?'#170405':'#020304';ctx.fillRect(1020,610,1160,110);
  if(player.inner){
    ctx.globalAlpha=.38;ctx.fillStyle='#7d1719';
    for(let i=0;i<20;i++){ctx.fillRect(1040+i*58,640+(i%3)*13,32,3)}
    ctx.globalAlpha=1;
  }
}

function drawPlatform(p,innerObj){
  ctx.fillStyle=player.inner?'#2b1717':'#1d2527';ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle=player.inner?'#5f2827':'#465153';ctx.fillRect(p.x,p.y,p.w,5);
  if(p.h>40){
    ctx.globalAlpha=.35;ctx.fillStyle=player.inner?'#120606':'#080d0e';
    for(let x=p.x+20;x<p.x+p.w;x+=70)ctx.fillRect(x,p.y+18,30,p.h-18);
    ctx.globalAlpha=1;
  }
}
function drawBoneBridge(p){
  ctx.fillStyle='#4d3630';ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='#b8a58a';ctx.globalAlpha=.74;
  for(let x=p.x+10;x<p.x+p.w-10;x+=28){
    ctx.save();ctx.translate(x,p.y+8);ctx.rotate((x%3-.8)*.08);ctx.fillRect(-11,-3,22,6);
    ctx.beginPath();ctx.arc(-12,0,4,0,7);ctx.arc(12,0,4,0,7);ctx.fill();ctx.restore();
  }ctx.globalAlpha=1;
}
function drawFalseWall(p){
  ctx.fillStyle='rgba(43,51,53,.97)';ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='rgba(181,154,97,.18)';
  for(let y=p.y+20;y<p.y+p.h;y+=40){ctx.fillRect(p.x+4,y,p.w-8,2)}
  ctx.strokeStyle='rgba(170,58,50,.18)';ctx.lineWidth=2;ctx.strokeRect(p.x+8,p.y+8,p.w-16,p.h-16);
}
function drawLantern(x,y){
  ctx.save();ctx.translate(x,y);ctx.fillStyle=player.inner?'#541214':'#8a5c2c';ctx.fillRect(-10,-38,20,27);
  ctx.fillStyle=player.inner?'rgba(170,30,28,.35)':'rgba(219,166,76,.35)';ctx.beginPath();ctx.arc(0,-25,34,0,7);ctx.fill();
  ctx.fillStyle='#24201b';ctx.fillRect(-2,-11,4,12);ctx.restore();
}
function drawShrine(x,groundY){
  ctx.fillStyle=player.inner?'#27100f':'#13191a';ctx.fillRect(x-70,groundY-130,140,130);
  ctx.fillStyle=player.inner?'#44201d':'#252e30';
  ctx.beginPath();ctx.moveTo(x-100,groundY-130);ctx.lineTo(x,groundY-190);ctx.lineTo(x+100,groundY-130);ctx.closePath();ctx.fill();
}
function drawBossGate(x,groundY){
  const open=bossKilled;
  ctx.strokeStyle=open?'rgba(166,45,42,.35)':'#241617';ctx.lineWidth=10;ctx.strokeRect(x-70,groundY-190,140,190);
  if(!open){ctx.fillStyle='rgba(30,9,10,.8)';ctx.fillRect(x-65,groundY-185,130,185);}
  else{
    ctx.fillStyle='rgba(155,34,34,.12)';ctx.fillRect(x-65,groundY-185,130,185);
    ctx.strokeStyle='rgba(210,77,70,.25)';ctx.lineWidth=2;
    for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(x-55+i*15,groundY-180);ctx.lineTo(x+40-i*7,groundY-15);ctx.stroke();}
  }
}

function drawActors(){
  drawEnemy();
  drawBoss();
  drawPlayer();
}
function drawPlayer(){
  const x=player.x,y=player.y;
  ctx.save();ctx.translate(x+player.w/2,y+player.h/2);ctx.scale(player.dir,1);
  if(player.inv>0&&Math.floor(player.inv*16)%2===0)ctx.globalAlpha=.38;
  // 残影
  if(player.inner){
    ctx.globalAlpha*=.18;ctx.fillStyle='#c0413c';ctx.fillRect(-player.w/2-8,-player.h/2+3,player.w,player.h);ctx.globalAlpha=1;
  }
  ctx.fillStyle=player.inner?'#3d1717':'#111719';ctx.fillRect(-14,-23,28,38);
  ctx.fillStyle=player.inner?'#b4a09a':'#d1c8b7';ctx.beginPath();ctx.arc(0,-29,10,0,7);ctx.fill();
  // 披风
  ctx.fillStyle=player.inner?'#6f1819':'#263236';ctx.beginPath();ctx.moveTo(-12,-18);ctx.lineTo(-24,28);ctx.lineTo(14,19);ctx.lineTo(12,-18);ctx.closePath();ctx.fill();
  // 腿
  ctx.fillStyle='#0c0d0e';ctx.fillRect(-10,13,8,22);ctx.fillRect(4,13,8,22);
  // 刀
  ctx.strokeStyle=player.inner?'#c5a6a0':'#b9ad8e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(8,-8);ctx.lineTo(35,-22);ctx.stroke();
  if(player.atk>0){
    ctx.strokeStyle=player.inner?'rgba(190,45,43,.8)':'rgba(222,210,175,.72)';ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(8,-4,55,-1.1,.7);ctx.stroke();
  }
  ctx.restore();
}
function drawEnemy(){
  if(!enemy.alive)return;
  const x=enemy.x,y=enemy.y;
  ctx.save();ctx.translate(x+21,y+22);ctx.scale(enemy.dir,1);
  ctx.fillStyle=enemy.stunned?'#3b2825':(player.inner?'#4f1717':'#202829');ctx.fillRect(-16,-16,32,40);
  ctx.fillStyle=player.inner?'#9a5a4d':'#7b776a';ctx.beginPath();ctx.arc(0,-20,9,0,7);ctx.fill();
  ctx.strokeStyle='#a79a7c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(14,-6);ctx.lineTo(29,18);ctx.stroke();
  if(enemy.stunned){ctx.fillStyle='#b63a34';ctx.font='18px serif';ctx.fillText('处决',-18,-36);}
  ctx.restore();
}
function drawBoss(){
  if(!boss.alive)return;
  ctx.save();ctx.translate(boss.x+46,boss.y+70);ctx.scale(boss.dir,1);
  ctx.fillStyle=player.inner?'#4d1112':'#161d1f';ctx.fillRect(-35,-48,70,105);
  ctx.fillStyle=player.inner?'#7c2521':'#3b4648';
  ctx.beginPath();ctx.moveTo(-52,-38);ctx.lineTo(-28,-72);ctx.lineTo(0,-55);ctx.lineTo(30,-78);ctx.lineTo(54,-38);ctx.closePath();ctx.fill();
  ctx.fillStyle='#b49b80';ctx.beginPath();ctx.arc(0,-51,17,0,7);ctx.fill();
  ctx.fillStyle='#050505';ctx.fillRect(-13,-55,26,11);
  ctx.strokeStyle=player.inner?'#ad514a':'#83755e';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(25,-10);ctx.lineTo(70,36);ctx.stroke();
  if(boss.stunned){ctx.fillStyle='#c34139';ctx.font='22px serif';ctx.fillText('斩',-8,-92);}
  ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    const a=Math.max(0,p.life/p.max);ctx.globalAlpha=Math.min(1,a);
    ctx.fillStyle=p.kind==='blood'?'#9f2524':'#c7bda9';
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();
  }ctx.globalAlpha=1;
}

function drawUI(){
  // 顶部状态
  ctx.save();
  const pad=34;
  ctx.font='14px "Microsoft YaHei",sans-serif';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,0,0,.42)';ctx.fillRect(24,22,398,78);
  ctx.fillStyle='#e7dfd0';ctx.font='600 15px "Microsoft YaHei",sans-serif';ctx.fillText('清醒值 / HP',pad,43);
  ctx.fillStyle='#241517';ctx.fillRect(pad,59,330,15);
  const ratio=player.hp/player.maxHp;
  ctx.fillStyle=ratio<=.5?'#9f2224':'#b39d67';ctx.fillRect(pad,59,330*ratio,15);
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(pad+165,57,2,19);
  ctx.fillStyle='#d7d0c3';ctx.font='13px ui-monospace,monospace';ctx.fillText(Math.ceil(player.hp)+' / 100',pad+340,67);
  ctx.fillStyle=player.inner?'#bd3b3b':'#bba56f';ctx.font='600 15px "Microsoft YaHei",sans-serif';
  ctx.fillText(player.inner?'里世界 · 现实':'表世界 · 幻境',pad,88);

  // 里世界持续衰减提示
  if(player.inner){
    ctx.fillStyle='rgba(133,19,21,.28)';ctx.fillRect(24,108,248,28);
    ctx.fillStyle='#d17872';ctx.font='12px "Microsoft YaHei",sans-serif';ctx.fillText('清醒持续流失 −1.35 / 秒',34,122);
  }

  // boss HP
  if(bossIntro && boss.alive){
    ctx.fillStyle='rgba(0,0,0,.56)';ctx.fillRect(420,31,440,53);
    ctx.fillStyle='#c9bda9';ctx.font='600 14px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText('判官残躯',640,48);
    ctx.fillStyle='#2a1314';ctx.fillRect(465,62,350,8);
    ctx.fillStyle='#8f2424';ctx.fillRect(465,62,350*(boss.hp/boss.maxHp),8);
    ctx.textAlign='left';
  }

  // 目标
  ctx.textAlign='right';ctx.fillStyle='rgba(0,0,0,.34)';ctx.fillRect(880,22,376,55);
  ctx.fillStyle='#a59472';ctx.font='12px "Microsoft YaHei",sans-serif';ctx.fillText('序章 · 无明古刹',1236,39);
  ctx.fillStyle='#ddd4c5';ctx.font='14px "Microsoft YaHei",sans-serif';
  const obj=bossKilled?'前往幻门，离开古刹':(bossIntro?'击败判官残躯：里世界伤害更高':(player.x<2200?'跨过无法通过的深渊':'深入古刹，寻找出口'));
  ctx.fillText(obj,1236,61);ctx.textAlign='left';

  // 中央消息
  if(messageT>0){
    const a=Math.min(1,messageT*2);ctx.globalAlpha=a;
    ctx.font='17px "Microsoft YaHei",sans-serif';
    const mw=Math.min(820,ctx.measureText(message).width+54);
    ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect((VIEW_W-mw)/2,620,mw,48);
    ctx.strokeStyle=player.inner?'rgba(155,35,35,.42)':'rgba(181,155,96,.32)';ctx.strokeRect((VIEW_W-mw)/2,620,mw,48);
    ctx.fillStyle='#e4ddd0';ctx.textAlign='center';ctx.fillText(message,VIEW_W/2,644);ctx.textAlign='left';ctx.globalAlpha=1;
  }

  if(dead||win){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,VIEW_W,VIEW_H);
    ctx.textAlign='center';
    ctx.fillStyle=win?'#b49b63':'#a9292a';ctx.font='700 58px "Noto Serif SC",serif';ctx.fillText(win?'无明已破':'重塑',640,300);
    ctx.fillStyle='#ddd4c5';ctx.font='18px "Microsoft YaHei",sans-serif';
    ctx.fillText(message,640,352);
    ctx.fillStyle='#8e8476';ctx.font='14px "Microsoft YaHei",sans-serif';ctx.fillText('按 R 重新开始',640,394);
    ctx.textAlign='left';
  }

  ctx.restore();
}

function drawTransition(){
  if(transition<=0)return;
  const p=transition;
  ctx.save();
  // 双重曝光错位
  ctx.globalAlpha=p*.32;ctx.fillStyle=transitionDir>0?'#8f1518':'#d0c3a5';
  for(let i=0;i<7;i++){
    const w=90+Math.sin(time*7+i)*35;
    ctx.fillRect((i*205+time*120)%1450-100,0,w,VIEW_H);
  }
  ctx.globalAlpha=p*.45;ctx.strokeStyle=transitionDir>0?'#b72a2c':'#d8c99e';ctx.lineWidth=2;
  for(let i=0;i<18;i++){ctx.beginPath();ctx.moveTo(0,(i*47+time*80)%720);ctx.lineTo(VIEW_W,(i*47+time*80)%720-25);ctx.stroke();}
  ctx.globalAlpha=p*.22;ctx.fillStyle='#fff';ctx.fillRect(0,0,VIEW_W,VIEW_H);
  ctx.restore();
}
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;update(dt);draw();requestAnimationFrame(loop);
}
startBtn.addEventListener('click',()=>{
  started=true;overlay.style.display='none';reset();
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  beep(96,.12,'triangle',.025);
});
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
